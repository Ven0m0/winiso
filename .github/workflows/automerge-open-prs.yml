name: Auto-merge Open Pull Requests

on:
  workflow_dispatch:
    inputs:
      merge_method:
        description: Merge method to apply to every eligible open pull request
        required: true
        default: squash
        type: choice
        options:
          - squash
          - merge
          - rebase
      include_drafts:
        description: Include draft pull requests when enabling auto-merge
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge-open-prs:
    name: Enable auto-merge on open PRs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Install workflow dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Ensure script is executable
        run: chmod +x scripts/*.sh

      - name: Enable auto-merge for eligible pull requests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          MERGE_METHOD: ${{ inputs.merge_method }}
          INCLUDE_DRAFTS: ${{ inputs.include_drafts }}
        run: ./scripts/automerge_open_prs.sh
