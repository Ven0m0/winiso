name: Copilot setup steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  UV_PYTHON_PREFERENCE: only-managed
  DEBIAN_FRONTEND: noninteractive
  DEBCONF_NOWARNINGS: yes

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-python: true

      - name: Install system packages
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: aria2 cabextract chntpw genisoimage libxml2-utils shellcheck shfmt wimtools
          version: 1.0

      - name: Inspect uv-managed Python
        run: |
          python --version
          which python
          uv python list --only-installed

      - name: Install Python validation tools with uv
        run: |
          for tool in ruff flake8 pytest; do
            echo "Installing $tool"
            uv tool install "$tool"
          done
          uv tool list

      - name: Prepare executable scripts
        run: chmod +x scripts/*.sh
