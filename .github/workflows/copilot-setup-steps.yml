name: Copilot setup steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up mise
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Install system packages used by this repo
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            aria2 \
            cabextract \
            chntpw \
            genisoimage \
            libxml2-utils \
            shellcheck \
            shfmt \
            wimtools

      - name: Install Python validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install black flake8 pytest

      - name: Trust and inspect mise tasks
        run: |
          mise trust --yes mise.toml
          mise tasks

      - name: Prepare executable scripts
        run: chmod +x scripts/*.sh
