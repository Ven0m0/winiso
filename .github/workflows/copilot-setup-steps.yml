name: Copilot setup steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  UV_PYTHON_PREFERENCE: only-managed
  DEBIAN_FRONTEND: noninteractive
  DEBCONF_NOWARNINGS: yes

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.14"
          enable-cache: true
          cache-python: true

      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yqq --no-install-recommends \
            aria2 \
            cabextract \
            chntpw \
            genisoimage \
            libxml2-utils \
            shellcheck \
            shfmt \
            wimtools

      - name: Inspect uv-managed Python
        run: |
          python --version
          which python
          uv python list --only-installed

      - name: Install repo Python tools with uv
        run: |
          for tool in basedpyright pytest ruff ty; do
            echo "Installing $tool"
            uv tool install "$tool"
          done
          uv tool list

      - name: Prepare executable scripts
        run: chmod +x scripts/*.sh

      - name: Validate shell scripts
        run: |
          for f in scripts/*.sh; do
            bash -n "$f"
          done

      - name: Validate XML configuration
        run: xmllint --noout config/autounattend.xml

      - name: Run Python unit tests
        run: uvx --with pytest pytest tests/

      - name: Run prerequisite validation when local UUP inputs are present
        run: |
          if [ -d uup_files ] && find uup_files -maxdepth 1 \( -name '*.cab' -o -name '*.esd' \) | grep -q .; then
            make validate
          else
            echo "Skipping make validate: add repository-local UUP inputs in uup_files/ to exercise prerequisite checks."
          fi
