name: Copilot setup steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            mise.toml

      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Install system packages used by this repo
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            aria2 \
            cabextract \
            chntpw \
            genisoimage \
            libxml2-utils \
            shellcheck \
            shfmt \
            wimtools

      - name: Trust and inspect mise tasks
        run: |
          mise trust --yes mise.toml
          mise install
          mise tasks
          mise ls --current
          mise exec -- python --version
          mise exec -- which python

      - name: Install Python validation tools with uv
        env:
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/uv-bin
        run: |
          echo "$UV_TOOL_BIN_DIR" >> "$GITHUB_PATH"
          mise exec -- sh -c 'uv tool install black && uv tool install flake8 && uv tool install pytest'
          mise exec -- uv tool list

      - name: Prepare executable scripts
        run: chmod +x scripts/*.sh
