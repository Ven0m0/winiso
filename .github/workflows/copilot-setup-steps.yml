name: Copilot setup steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
          cache-python: true

      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Install system packages used by this repo
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            aria2 \
            cabextract \
            chntpw \
            genisoimage \
            libxml2-utils \
            shellcheck \
            shfmt \
            wimtools

      - name: Trust and inspect mise tasks
        run: |
          mise trust --yes mise.toml
          mise tasks

      - name: Inspect uv-managed Python
        run: |
          python --version
          which python
          uv python list --only-installed

      - name: Install Python validation tools with uv
        run: |
          for tool in ruff flake8 pytest; do
            echo "Installing $tool"
            uv tool install "$tool"
          done
          uv tool list

      - name: Prepare executable scripts
        run: chmod +x scripts/*.sh
