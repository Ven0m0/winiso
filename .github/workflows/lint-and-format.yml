name: Lint and Format Check

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-bash:
    name: Lint Bash Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install shell tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yqq --no-install-recommends shellcheck shfmt

      - name: Run ShellCheck on maintained shell entrypoints
        run: |
          shellcheck scripts/convert_config.sh scripts/utils.sh

      - name: Check shell formatting
        run: |
          shfmt -d scripts/convert_config.sh scripts/utils.sh

  lint-python:
    name: Lint Python Scripts
    runs-on: ubuntu-latest
    env:
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up uv-managed Python
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"
          enable-cache: true
          cache-python: true

      - name: Lint with Ruff
        run: uvx ruff check scripts tests

      - name: Check Python formatting
        run: uvx ruff format --check scripts tests

  lint-xml:
    name: Lint XML Config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install libxml2-utils
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yqq --no-install-recommends libxml2-utils

      - name: Check XML syntax
        run: |
          xmllint --noout ventoy/answer/autounattend.xml
          xmllint --noout config/autounattend.xml

      - name: Check config/autounattend.xml matches canonical ventoy/answer/autounattend.xml
        run: diff -u ventoy/answer/autounattend.xml config/autounattend.xml

  lint-reg:
    name: Lint Registry Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Validate .reg headers (standalone + embedded in autounattend.xml)
        run: python3 scripts/validate_reg_files.py

  lint-powershell:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
            Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force -SkipPublisherCheck -AllowClobber
          }

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Continue'

          $psFiles = Get-ChildItem -Recurse -Include *.ps1, *.psm1, *.psd1 -File |
            Where-Object { $_.FullName -notmatch '\\node_modules\\|\\\.git\\' }

          $results = foreach ($f in $psFiles) {
            Invoke-ScriptAnalyzer -Path $f.FullName -Settings .\PSScriptAnalyzerSettings.psd1
          }

          if ($results) {
            $results | Format-Table ScriptName, Line, RuleName, Severity, Message -AutoSize | Out-String -Width 200 | Write-Host
            Write-Host "PSScriptAnalyzer found $($results.Count) issue(s)"
            exit 1
          }
          Write-Host "No PSScriptAnalyzer issues found"
