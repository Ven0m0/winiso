repos:
  # Ruff - Python linting and formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      # Run linter and auto-fix issues
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]
        stages: [pre-commit]
      - id: ruff-format
        types_or: [python, pyi]
        stages: [pre-commit]
  - repo: https://github.com/DetachHead/basedpyright-prek-mirror
    rev: 1.39.10
    hooks:
      - id: basedpyright
        files: ^scripts/download_uup\.py$
        additional_dependencies: [httpx, orjson]
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^CLAUDE\.md$
      - id: end-of-file-fixer
        exclude: ^CLAUDE\.md$
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-toml
      - id: fix-byte-order-marker
        exclude: ^CLAUDE\.md$
      - id: mixed-line-ending
        exclude: ^CLAUDE\.md$
      - id: detect-private-key
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: forbid-submodules

  - repo: local
    hooks:
      - id: validate-xml
        name: Validate XML config files
        entry: python3 scripts/validate_xml.py
        language: system
        files: \.xml$
        pass_filenames: true

  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 44.32.5
    hooks:
      - id: renovate-config-validator

  - repo: https://github.com/biomejs/pre-commit
    rev: v2.5.8
    hooks:
      - id: biome-ci
        exclude: ^ventoy/
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.0
    hooks:
      - id: check-dependabot
      - id: check-github-actions
      - id: check-github-workflows
  - repo: https://github.com/mangiucugna/gha-updater-pre-commit
    rev: v0.1
    hooks:
      - id: gha-update
        stages: [manual]

  # =============================================================================
  # PowerShell hooks
  # =============================================================================
  - repo: https://github.com/thetestlabs/py-psscriptanalyzer
    rev: v0.3.1 # Use the latest version
    hooks:
      - id: py-psscriptanalyzer # Lint your PowerShell
        args:
          - "--severity"
          - "Warning"
          - "--include-rules"
          - "PSAvoidGlobalAliases,PSAvoidUsingConvertToSecureStringWithPlainText,PSAvoidUsingEmptyCatchBlock,PSAvoidUsingInvokeExpression,PSAvoidUsingPositionalParameters,PSAvoidUsingUsernameAndPasswordParams,PSUseBOMForUnicodeEncodedFile,PSUseCorrectCasing,PSProvideCommentHelp,PSReservedCmdletChar,PSReservedParams,PSUseApprovedVerbs,PSUseCmdletCorrectly,PSUseConsistentIndentation,PSUseConsistentWhitespace,PSUseSupportsShouldProcess,PSUseVerbosityForRequestedLevel"
        exclude: ^uupdump/
      - id: py-psscriptanalyzer-format # Format your PowerShell
        exclude: ^uupdump/
