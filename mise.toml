# =============================================================================
# mise.toml - Cross-platform development environment
# =============================================================================
# Usage:
#   mise trust
#   mise run install-deps
#   mise run build
# =============================================================================
[settings]
experimental = true
color = true
yes = true
auto_install = true

[settings.python]
uv_venv_auto = "create|source"
uv_venv_create_args = ["--seed", "--system-site-packages"]

[settings.pipx]
uvx = true

[settings.dotnet]
cli_telemetry_optout = true

[tools]
python = "3.14"
uv = "latest"
ruff = "latest"
ty = "latest"
shellcheck = "latest"
shfmt = "latest"
powershell = "latest"
# xmllint: system package (libxml2-utils on Debian/Ubuntu, libxml2 on Arch/Fedora)
# biome: JS/TS/JSON/HTML/CSS linter - use bunx @biomejs/biome
# PSScriptAnalyzer: PowerShell module, not mise-manageable - `mise run pwsh-install` bootstraps it

[env]
PROJECT_ROOT = "{{config_root}}"
# UV_PYTHON = { value = "{{ tools.python.path }}", tools = true }
UV_LINK_MODE = "symlink"
_.python.venv = { path = ".venv", create = true, uv_create_args = ["--seed", "--system-site-packages"] }

[tasks]
# Install system dependencies
install-deps = [
  """@if linux: if command -v pacman >/dev/null 2>&1; then
    pacman -S --needed aria2 cabextract wimlib chntpw cdrtools
  elif command -v apt-get >/dev/null 2>&1; then
    apt update -qq && apt install -yq aria2 cabextract wimtools chntpw genisoimage
  else
    echo 'Unsupported Linux distribution: no supported package manager found (pacman, apt-get, or dnf).' >&2
    exit 1
  fi""",
  "@if windows: choco install -yf --acceptlicense wimlib aria2 WindowsADK"
]

# Download UUP files
download = [
  "python {{config_root}}/scripts/download_uup.py"
]

# Validate prerequisites
validate = [
  "@if linux: python3 {{config_root}}/scripts/validate_prereqs.py",
  "@if windows: pwsh -nop -c \"Write-Error 'validate requires the Linux build toolchain. Run this task from WSL or Git Bash.'; exit 1\""
]

# Full build
build = [
  "@if linux: python3 {{config_root}}/scripts/build.py",
  "@if darwin: python3 {{config_root}}/scripts/build.py",
  "@if windows: pwsh -nop -c \"Write-Error 'build requires the Linux build toolchain. Run this task from WSL or Git Bash.'; exit 1\""
]

# Build Pro edition
build-pro = [
  "@if linux: TARGET_EDITION=Professional FALLBACK_EDITION=Professional python3 {{config_root}}/scripts/build.py",
  "@if darwin: TARGET_EDITION=Professional FALLBACK_EDITION=Professional python3 {{config_root}}/scripts/build.py",
  "@if windows: pwsh -nop -c \"Write-Error 'build-pro requires the Linux build toolchain. Run this task from WSL or Git Bash.'; exit 1\""
]

# Build with pause for Windows DISM stage
build-pause = [
  "@if linux: PAUSE_FOR_WINDOWS_STAGE=1 python3 {{config_root}}/scripts/build.py",
  "@if darwin: PAUSE_FOR_WINDOWS_STAGE=1 python3 {{config_root}}/scripts/build.py",
  "@if windows: pwsh -nop -c \"Write-Error 'build-pause requires the Linux build toolchain. Run this task from WSL or Git Bash.'; exit 1\""
]

# Clean artifacts (Linux/macOS)
clean-unix = [
  "rm -rf {{config_root}}/scripts/ISODIR",
  "rm -f {{config_root}}/*.iso",
  "rm -f {{config_root}}/output/*.iso"
]

# Clean artifacts (Windows PowerShell)
clean-windows = [
  "if (Test-Path {{config_root}}/scripts/ISODIR) { Remove-Item -Recurse -Force {{config_root}}/scripts/ISODIR }",
  "Get-ChildItem {{config_root}} -Filter *.iso | Remove-Item -Force",
  "Get-ChildItem {{config_root}}/output -Filter *.iso | Remove-Item -Force"
]

# List builds from API
list-builds = [
  "python {{config_root}}/scripts/download_uup.py --list"
]

# Show API version
api-version = [
  "python {{config_root}}/scripts/download_uup.py --version"
]

# Show available tasks
help = [
  "mise tasks"
]

[tasks.install]
description = 'Mise ci install'
run = [
  "export DEBIAN_FRONTEND=noninteractive DEBCONF_NOWARNINGS=yes; apt-get update -qq && apt-get install -yqq --no-install-recommends genisoimage libfuse2 aria2 cabextract wimtools chntpw",
  "[[ -f pyproject.toml ]] && uv sync --frozen || true",
  "[[ -f .venv/bin/activate ]] && source .venv/bin/activate"
]

[tasks.linux]
description = "Install build dependencies on Linux"
run = [
  "pacman -Sq --needed aria2 cabextract wimlib chntpw cdrtools libxml2 2>/dev/null || (apt update && apt install -y aria2 cabextract wimtools chntpw genisoimage libxml2-utils) 2>/dev/null || (dnf install -y aria2 cabextract wimlib-utils chntpw genisoimage libxml2)"
]

[tasks.windows]
description = "Install build dependencies on Windows (Admin)"
run = [
  # TODO / FIXME: install "cabextract genisoimage" on windows. Neither choco nor scoop have them
  "choco install -yf --acceptlicense wimlib aria2 WindowsADK",
]

# Aliases for platform-specific installs
[tasks.arch]
description = "Install deps (Arch Linux)"
run = ["pacman -Sq --needed aria2 cabextract wimlib chntpw cdrtools"]

[tasks.debian]
description = "Install deps (Debian/Ubuntu)"
run = ["export DEBIAN_FRONTEND=noninteractive DEBCONF_NOWARNINGS=yes; apt-get update -qq && apt-get install -yqq --no-install-recommends aria2 cabextract wimtools chntpw genisoimage libxml2-utils libfuse2"]

[tasks.test]
description = "Run tests"
run = "pytest tests/"

[tasks.lint]
description = "Lint + format-check Python (ruff) and type-check download_uup.py (ty)"
run = [
  "ruff check scripts tests",
  "ruff format --check scripts tests",
  "ty check scripts/download_uup.py"
]

# shellcheck + shfmt over the maintained bash entrypoints (custom_convert.sh is
# upstream-derived/patch-only but already carries its own shellcheck-disable
# comments, so it's linted here too, unlike the narrower CI job)
[tasks.lint-shell]
description = "Lint bash scripts with shellcheck + shfmt"
run = [
  "shellcheck scripts/custom_convert.sh scripts/convert_config.sh scripts/utils.sh",
  "shfmt -d scripts/custom_convert.sh scripts/convert_config.sh scripts/utils.sh"
]

# Validates every *.xml file (well-formed via xmllint if installed, else stdlib
# ElementTree; UTF-8 no-BOM), plus that config/autounattend.xml (a symlink) resolves to
# the canonical ventoy/answer/autounattend.xml - a canary for a broken/unresolved
# symlink (e.g. a checkout without symlink support).
[tasks.lint-xml]
description = "Validate all XML config files (scripts/validate_xml.py)"
run = ["python3 scripts/validate_xml.py"]

# .reg headers: standalone *.reg files and .reg content embedded in autounattend.xml
[tasks.lint-reg]
description = "Validate .reg file headers (standalone + embedded in autounattend.xml)"
run = ["python3 scripts/validate_reg_files.py"]

# Debloat glob patterns: syntax, duplicates, protected AppX keep-list collisions
[tasks.lint-debloat]
description = "Validate config/debloat_list.txt patterns before applying to a WIM"
run = ["python3 scripts/validate_debloat.py"]

# Bootstrap the PSScriptAnalyzer module (not mise-manageable; it's a PS Gallery module)
[tasks.pwsh-install]
description = "Install PSScriptAnalyzer PowerShell module (CurrentUser scope)"
run = [
  "pwsh -NoProfile -Command \"if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) { Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force -SkipPublisherCheck -AllowClobber }\"",
]

# PSScriptAnalyzer over the Windows-side PowerShell helper scripts
[tasks.lint-ps]
description = "Lint PowerShell scripts with PSScriptAnalyzer (requires PowerShell 7+)"
depends = ["pwsh-install"]
run = [
  "pwsh -NoProfile -Command \"Import-Module PSScriptAnalyzer; $r = Get-ChildItem -Recurse -Include *.ps1,*.psm1,*.psd1 -File | Where-Object { $_.FullName -notmatch '[\\\\/]\\.git[\\\\/]' } | ForEach-Object { Invoke-ScriptAnalyzer -Path $_.FullName -Settings ./PSScriptAnalyzerSettings.psd1 }; if ($r) { $r | Format-Table -AutoSize; exit 1 }\"",
]

# Biome: fast JS/TS/JSON/HTML/CSS linter and formatter
[tasks.lint-biome]
description = "Lint and format JS/TS/JSON/HTML/CSS with biome"
run = ["bun x @biomejs/biome check --write . --diagnostic-level=error"]

# Run all .pre-commit-config.yaml hooks via prek (drop-in pre-commit replacement, same config)
[tasks.precommit]
description = "Run pre-commit hooks against all files (via prek; `pre-commit run --all-files` also works)"
run = ["prek run --all-files"]

# Install prek's git hook shims (equivalent to `pre-commit install`)
[tasks.precommit-install]
description = "Install git hooks via prek (equivalent to `pre-commit install`)"
run = ["prek install"]
