# =============================================================================
# mise.toml - Cross-platform development environment
# =============================================================================
# Usage:
#   mise trust mise.toml
#   mise run install-deps
#   mise run build
# =============================================================================

min_version = "2024.9.5"

[settings]
experimental = true
color = true
yes = true
auto_install = true

[settings.python]
uv_venv_auto = "create|source"
uv_venv_create_args = ["--seed", "--system-site-packages"]

[settings.pipx]
uvx = true

[tools]
python = "3.14.4"
uv = "latest"
ruff = "latest"
prek = "latest"

[env]
PROJECT_ROOT = "{{config_root}}"
# Ensure uv uses the exact Python interpreter installed by `mise install`.
# `tools = true` makes `tools.python.path` available when mise resolves tool-aware env vars at runtime.
UV_PYTHON = { value = "{{ tools.python.path }}", tools = true }
UV_LINK_MODE = "symlink"
_.python.venv = { path = ".venv", create = true, uv_create_args = ["--seed", "--system-site-packages"] }

[tasks]
# Install system dependencies
install-deps = [
  """@if linux: if command -v pacman >/dev/null 2>&1; then
    sudo pacman -S --needed aria2 cabextract wimlib chntpw cdrtools
  elif command -v apt-get >/dev/null 2>&1; then
    sudo apt update && sudo apt install -y aria2 cabextract wimtools chntpw genisoimage
  elif command -v dnf >/dev/null 2>&1; then
    sudo dnf install -y aria2 cabextract wimlib-utils chntpw genisoimage
  else
    echo 'Unsupported Linux distribution: no supported package manager found (pacman, apt-get, or dnf).' >&2
    exit 1
  fi""",
  "@if darwin: brew install wimlib cdrtools aria2",
  "@if windows: choco install -y wimlib aria2 cabextract genisoimage"
]

# Download UUP files
download = [
  "python {{config_root}}/scripts/download_uup.py"
]

# Validate prerequisites
validate = [
  "@if linux: bash {{config_root}}/scripts/validate_prereqs.sh",
  "@if darwin: bash {{config_root}}/scripts/validate_prereqs.sh",
  "@if windows: powershell -NoProfile -Command \"Write-Error 'validate requires a POSIX shell. Run this task from WSL or Git Bash.'; exit 1\""
]

# Full build
build = [
  "@if linux: bash {{config_root}}/scripts/build.sh",
  "@if darwin: bash {{config_root}}/scripts/build.sh",
  "@if windows: powershell -NoProfile -Command \"Write-Error 'build requires a POSIX shell. Run this task from WSL or Git Bash.'; exit 1\""
]

# Build Pro edition
build-pro = [
  "@if linux: TARGET_EDITION=Professional FALLBACK_EDITION=Professional bash {{config_root}}/scripts/build.sh",
  "@if darwin: TARGET_EDITION=Professional FALLBACK_EDITION=Professional bash {{config_root}}/scripts/build.sh",
  "@if windows: powershell -NoProfile -Command \"Write-Error 'build-pro requires a POSIX shell. Run this task from WSL or Git Bash.'; exit 1\""
]

# Build with pause for Windows DISM stage
build-pause = [
  "@if linux: PAUSE_FOR_WINDOWS_STAGE=1 bash {{config_root}}/scripts/build.sh",
  "@if darwin: PAUSE_FOR_WINDOWS_STAGE=1 bash {{config_root}}/scripts/build.sh",
  "@if windows: powershell -NoProfile -Command \"Write-Error 'build-pause requires a POSIX shell. Run this task from WSL or Git Bash.'; exit 1\""
]

# Clean artifacts (Linux/macOS)
clean-unix = [
  "rm -rf {{config_root}}/scripts/ISODIR",
  "rm -f {{config_root}}/*.iso",
  "rm -f {{config_root}}/output/*.iso"
]

# Clean artifacts (Windows PowerShell)
clean-windows = [
  "if (Test-Path {{config_root}}/scripts/ISODIR) { Remove-Item -Recurse -Force {{config_root}}/scripts/ISODIR }",
  "Get-ChildItem {{config_root}} -Filter *.iso | Remove-Item -Force",
  "Get-ChildItem {{config_root}}/output -Filter *.iso | Remove-Item -Force"
]

# List builds from API
list-builds = [
  "python {{config_root}}/scripts/download_uup.py --list"
]

# Show API version
api-version = [
  "python {{config_root}}/scripts/download_uup.py --version"
]

# Show available tasks
help = [
  "mise tasks"
]

[tasks.install]
description = 'Mise ci install'
file = '.mise/tasks/install'

[tasks.linux]
description = "Install build dependencies on Linux"
run = [
  "sudo pacman -Sq --needed aria2 cabextract wimlib chntpw cdrtools 2>/dev/null || (sudo apt update && sudo apt install -y aria2 cabextract wimtools chntpw genisoimage) 2>/dev/null || (sudo dnf install -y aria2 cabextract wimlib-utils chntpw genisoimage)"
]

[tasks.windows]
description = "Install build dependencies on Windows (Admin)"
run = ["choco install -y wimlib aria2 cabextract genisoimage"]

# Aliases for platform-specific installs
[tasks.arch]
description = "Install deps (Arch Linux)"
run = ["sudo pacman -Sq --needed aria2 cabextract wimlib chntpw cdrtools"]

[tasks.debian]
description = "Install deps (Debian/Ubuntu)"
run = ["sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive DEBCONF_NOWARNINGS=yes apt-get install -yqq --no-install-recommends aria2 cabextract wimtools chntpw genisoimage libfuse2"]

[tasks.test]
description = "Run tests"
run = "pytest tests/"

[tasks.lint]
description = "Lint the code"
run = "ruff ."
